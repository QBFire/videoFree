    <!-- Edge浏览器兼容性优化 -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

      /* Edge浏览器特定样式修复 */

        /* Edge 12-18特定修复 */
        .edge-fix {
          display: -ms-flexbox;
          display: flex;
        }
      }
    </style>
  </head>
